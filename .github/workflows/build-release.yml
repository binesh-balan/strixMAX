name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
            wheel-platform: macosx_11_0_arm64
          - os: macos-15-intel
            target: macos-x86_64
            wheel-platform: macosx_11_0_x86_64
          - os: ubuntu-22.04
            target: linux-x86_64
            wheel-platform: manylinux_2_17_x86_64
          - os: ubuntu-22.04-arm
            target: linux-arm64
            wheel-platform: manylinux_2_17_aarch64
          - os: windows-latest
            target: windows-x86_64
            wheel-platform: win_amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: false

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00  # v6.0.0
        with:
          go-version: '1.24.x'
          check-latest: true
          cache: false

      # cryptography 49+ ships no Intel macOS wheel, so `uv sync --frozen`
      # builds it from the locked (hash-checked) sdist here. That needs Rust,
      # which the runner image provides, and OpenSSL headers from Homebrew.
      # Linking OpenSSL statically keeps the PyInstaller bundle self-contained.
      - name: Prepare cryptography source build (Intel macOS)
        if: matrix.target == 'macos-x86_64'
        shell: bash
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          rustc --version
          {
            echo "OPENSSL_DIR=$(brew --prefix openssl@3)"
            echo "OPENSSL_STATIC=1"
          } >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        env:
          STRIX_WHEEL_PLATFORM_TAG: ${{ matrix.wheel-platform }}
        run: |
          uv sync --frozen
          uv build --wheel
          uv run python -c 'import glob, os, sys, zipfile; wheels = glob.glob("dist/*.whl"); assert len(wheels) == 1, wheels; archive = zipfile.ZipFile(wheels[0]); tui = "strix/bin/strix-tui.exe" if sys.platform == "win32" else "strix/bin/strix-tui"; assert tui in archive.namelist(); metadata = archive.read(next(name for name in archive.namelist() if name.endswith(".dist-info/WHEEL"))).decode(); assert "Root-Is-Purelib: false" in metadata; assert "Tag: py3-none-" + os.environ["STRIX_WHEEL_PLATFORM_TAG"] in metadata'

          uv run pyinstaller strix.spec --noconfirm

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PYI_BINARY="dist/strix.exe"
            TUI_NAME="strix-tui.exe"
            dist/strix.exe --version
          else
            PYI_BINARY="dist/strix"
            TUI_NAME="strix-tui"
            dist/strix --version
          fi
          uv run pyi-archive_viewer -l -r "$PYI_BINARY" > archive.txt
          grep -E "strix[/\\]+bin[/\\]+$TUI_NAME" archive.txt >/dev/null
          grep -E "'google\.auth\.transport\.requests'" archive.txt >/dev/null
          grep -E "'boto3\.session'" archive.txt >/dev/null

          if [[ "${{ matrix.target }}" == "linux-arm64" ]]; then
            file dist/strix
            file dist/strix | grep -q "ARM aarch64" || {
              echo "::error::linux-arm64 artifact is not an ARM aarch64 binary"
              exit 1
            }
          fi

          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          mkdir -p dist/release

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp dist/strix.exe "dist/release/strix-${VERSION}-${{ matrix.target }}.exe"
            (cd dist/release && 7z a "strix-${VERSION}-${{ matrix.target }}.zip" "strix-${VERSION}-${{ matrix.target }}.exe")
          else
            cp dist/strix "dist/release/strix-${VERSION}-${{ matrix.target }}"
            chmod +x "dist/release/strix-${VERSION}-${{ matrix.target }}"
            tar -C dist/release -czvf "dist/release/strix-${VERSION}-${{ matrix.target }}.tar.gz" "strix-${VERSION}-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: strix-${{ matrix.target }}
          path: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/*.whl
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    # Protected environment: configure required reviewers / tag rules for
    # `release` in the repository settings.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: release
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd release
          find . -type f ! -name SHA256SUMS -printf '%P\n' | LC_ALL=C sort > ../asset-list.txt
          if [ ! -s ../asset-list.txt ]; then
            echo "::error::no release assets found"
            exit 1
          fi
          # Assets are uploaded flat, so checksum entries use basenames.
          while IFS= read -r asset; do
            (cd "$(dirname "$asset")" && sha256sum "$(basename "$asset")")
          done < ../asset-list.txt > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          generate_release_notes: true
          files: release/**
